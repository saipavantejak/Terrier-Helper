name: Verify TerrierHelper
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Production startup smoke check
        run: |
          npm start > /tmp/terrier.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:3000/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/api/health
          curl -fsS http://localhost:3000/ | grep 'TerrierHelper'
