name: Verify TerrierHelper
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: terrier
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: terrier_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://terrier:local-ci-only@localhost:5432/terrier_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:runtime
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Browser workflow against PostgreSQL cloud storage
        run: npm run test:browser
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Production startup smoke check
        run: |
          npm start > /tmp/terrier.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:3000/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/api/health
          curl -fsS http://localhost:3000/ | grep 'TerrierHelper'
